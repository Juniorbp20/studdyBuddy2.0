[versions]
agp = "8.11.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
room = "2.6.1"
lifecycle = "2.8.7"
recyclerview = "1.3.2"
constraintlayout = "2.2.0"
swiperefreshlayout = "1.1.0"
coroutines = "1.8.1"
splashscreen = "1.0.1"
work = "2.9.1"

